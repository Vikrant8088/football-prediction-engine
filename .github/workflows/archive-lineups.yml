# Archive pre-deadline predicted lineups.
#
# This dataset is unrecoverable: you cannot go back and ask what a predicted XI *was*
# last Saturday. That is exactly why the signal is not backtestable today (Phase 6f),
# and why the archive must never miss a gameweek. So it runs in CI rather than on a
# laptop that might be closed on a Saturday morning.
#
# Daily, deliberately. The snapshot we will actually *use* is the last one before each
# deadline — but deadlines move (Friday games, midweek rounds), and GitHub's cron is
# only best-effort anyway. Running daily needs no deadline arithmetic: at consumption
# time we simply take the latest snapshot before the deadline. It also buys the
# prediction *trajectory* for free, which answers a real question later — how much
# more accurate is a T-2h prediction than a T-48h one?
#
# Cost: ~60KB/run, ~16MB/season.

name: Archive predicted lineups

on:
  schedule:
    # 09:00 UTC daily — shortly before a typical Saturday 10:00 UTC (11:00 BST)
    # deadline. Best-effort: GitHub may delay cron under load, which is precisely
    # why nothing depends on the exact minute.
    - cron: "0 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: archive-lineups
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The archiver is deliberately standalone: stdlib + requests, no pandas, no
      # ingested data lake. Keeps this job fast and hard to break.
      - name: Install dependencies
        run: pip install requests

      # continue-on-error, then an explicit failure gate below. Rationale: a GENUINE
      # partial (say 18/20 clubs) is real, unrecoverable data and must still be
      # committed — but the job must go red so a degraded feed cannot rot the archive
      # unnoticed. An EMPTY parse saves nothing, so the commit step below no-ops.
      #
      # FFP blocks GitHub's datacenter IPs (a 204 stub, confirmed across retries), and
      # so does every FREE-KEYLESS reader (Jina 403s from CI) — datacenter throttling is
      # universal. One FREE key fixes it: JINA_API_KEY (jina.ai, no card) rides as a
      # Bearer header and lets the reader serve CI. LINEUP_FETCH_PROXY is the alternative
      # (a paid scraping-proxy template). Set EITHER as a repo secret; see docs/06. With
      # neither, this fails (correctly — the feed is genuinely unreachable from CI).
      - name: Archive snapshot
        id: archive
        continue-on-error: true
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          LINEUP_FETCH_PROXY: ${{ secrets.LINEUP_FETCH_PROXY }}
        run: python -m research.data.predicted_lineups

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/lineups/
          if git diff --cached --quiet; then
            echo "No new snapshot to commit."
          else
            git commit -m "chore(lineups): archive predicted-lineup snapshot [skip ci]"
            # Rebase before pushing: a human commit may have landed since checkout.
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # Never let a bad fetch pass as success. An empty parse archives nothing; a
      # partial archives real data but still fails here, loudly.
      - name: Fail if the archive was empty or incomplete
        if: steps.archive.outcome != 'success'
        run: |
          echo "::error::Archiver reported an empty or partial parse — see the 'Archive snapshot' step for diagnostics (title/markers reveal a bot challenge vs a layout change). If both direct and Jina transports failed, the free reader may be rate-limited; a LINEUP_FETCH_PROXY secret is the reliable upgrade (docs/06)."
          exit 1
