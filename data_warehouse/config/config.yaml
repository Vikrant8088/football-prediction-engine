# Football Data Warehouse configuration.
#
# All paths, URLs, league codes, seasons and HTTP behaviour live here so that
# adding a league/season or tuning HTTP behaviour never requires a code change.

storage:
  # Relative to the repository root.
  raw_data_dir: "data/raw"

logging:
  # Relative to the repository root.
  log_dir: "logs"
  filename: "data_warehouse.log"
  level: "INFO"
  max_bytes: 5242880
  backup_count: 3

http:
  timeout_seconds: 30
  max_retries: 3
  backoff_factor: 0.5
  # Minimum delay enforced between consecutive requests to the same source,
  # to avoid hammering a small, free, volunteer-run site.
  request_delay_seconds: 1.0
  user_agent: "football-prediction-engine-data-warehouse/1.0 (+https://github.com/)"

sources:
  football_data_co_uk:
    base_url: "https://www.football-data.co.uk/mmz4281"
    leagues:
      E0: "England - Premier League"
      E1: "England - Championship"
      E2: "England - League One"
      E3: "England - League Two"
      SP1: "Spain - La Liga"
      SP2: "Spain - Segunda Division"
      D1: "Germany - Bundesliga"
      D2: "Germany - Bundesliga 2"
      I1: "Italy - Serie A"
      I2: "Italy - Serie B"
      F1: "France - Ligue 1"
      F2: "France - Ligue 2"
      N1: "Netherlands - Eredivisie"
      B1: "Belgium - First Division A"
      P1: "Portugal - Primeira Liga"
      T1: "Turkey - Super Lig"
      G1: "Greece - Super League"
      SC0: "Scotland - Premiership"
    seasons:
      - "0910"
      - "1011"
      - "1112"
      - "1213"
      - "1314"
      - "1415"
      - "1516"
      - "1617"
      - "1718"
      - "1819"
      - "1920"
      - "2021"
      - "2122"
      - "2223"
      - "2324"
      - "2425"
      - "2526"

  understat:
    # Understat serves per-league-season match data (including Expected Goals,
    # xG) as JSON from an XHR endpoint: {base_url}/{league}/{start_year}.
    # The endpoint returns 404 unless the X-Requested-With header is present,
    # so it is declared here rather than hardcoded in the source module.
    base_url: "https://understat.com/getLeagueData"
    request_headers:
      X-Requested-With: "XMLHttpRequest"
    # Understat's own league identifiers (not football-data.co.uk's codes).
    # Understat covers Europe's top five leagues plus the Russian Premier League.
    leagues:
      EPL: "England - Premier League"
      La_liga: "Spain - La Liga"
      Bundesliga: "Germany - Bundesliga"
      Serie_A: "Italy - Serie A"
      Ligue_1: "France - Ligue 1"
      RFPL: "Russia - Premier League"
    # A season is identified by the calendar year it STARTED (2014 = 2014/15).
    # Understat's xG data begins with the 2014/15 season.
    seasons:
      - "2014"
      - "2015"
      - "2016"
      - "2017"
      - "2018"
      - "2019"
      - "2020"
      - "2021"
      - "2022"
      - "2023"
      - "2024"
      - "2025"

  api_football:
    # Injuries / line-ups source (api-sports.io direct endpoint). The API key is
    # a SECRET: it is read from the APIFOOTBALL_KEY environment variable at
    # runtime and is NEVER stored in this file or committed to git.
    base_url: "https://v3.football.api-sports.io"
    # Numeric league ids as API-Football defines them (39 = Premier League).
    leagues:
      "39": "England - Premier League"
    # Seasons the FREE plan grants injury access to (empirically confirmed;
    # older seasons return a plan-restriction error). Paid plans reach further.
    seasons:
      - "2022"
      - "2023"
      - "2024"
